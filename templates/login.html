{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Camus Flow - Student Permission and Leave Management System</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="mt-3 small text-muted">
                    Demo accounts:
                    <ul>
                        <li>Student: Haripriya (haripriya@student.com) / haripriya123</li>
                        <li>Coordinator: coordinator@college.edu / coord123</li>
                        <li>HOD: hod@college.edu / hod123</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
